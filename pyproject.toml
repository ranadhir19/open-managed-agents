[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "open-managed-agents"
version = "0.1.0"
description = "A model-agnostic managed-agent platform: declared agents, dynamically composed LangGraph workflows, budget governance, approval gates, retry/replan recovery"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["langgraph>=0.2", "langchain-core", "numpy", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]
